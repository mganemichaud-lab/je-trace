<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planche des tracés</title>
  <style>
    :root { --paper: #faf8f3; --band: #f2eee4; --line: #cfc7b5; --road: #e7e1d3; --muted: #7a7366; --ink: #1f3a5f; }
    body { margin: 0; padding: 16px; background: var(--paper); color: var(--ink);
           font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
    h1 { font-size: 24px; margin: 0 0 4px; }
    p { margin: 0 0 16px; color: var(--muted); }
    h2 { font-size: 18px; margin: 24px 0 8px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
    figure { margin: 0; background: #fff; border-radius: 14px; box-shadow: 0 2px 8px rgba(60, 50, 30, .1);
             break-inside: avoid; }
    canvas { display: block; width: 100%; aspect-ratio: 1; }
    figcaption { text-align: center; font-size: 15px; padding: 0 0 8px; color: var(--muted); }
    @media print {
      body { background: #fff; padding: 0; }
      figure { box-shadow: none; border: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <h1>Planche des tracés</h1>
  <p>Chaque trait a sa couleur : 1 vert, 2 bleu, 3 orange, 4 violet. Le point numéroté montre où commencer, les flèches le sens.</p>
  <div id="sheet"></div>
  <script src="js/glyphs.js"></script>
  <script src="js/planche.js"></script>
</body>
</html>
